{% extends "base.html" %}
{% block title %}用户登录{% endblock %}

{% block content %}
<style>
  .auth-page .nav-bar, .auth-page .sidebar, .auth-page .footer {
    display: none !important;
  }
  .auth-page .layout {
    display: block;
  }
  .auth-page .main-content {
    padding: 0;
  }
</style>
<div class="auth-page">
  <div class="auth-wrap">
    <form class="auth-card" method="post" action="{{ url_for('auth.user_login', uid=user.id, next=next_url) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <h2>Welcome back!</h2>
      <p class="auth-subtitle">Please enter your details</p>
      
      <div class="form-row">
        <label>Username</label>
        <input type="text" value="{{ user.name }}" disabled class="disabled-input">
      </div>
      
      <div class="form-row">
        <label>Password</label>
        <input type="password" name="password" required autofocus autocomplete="current-password" placeholder="Enter your password">
      </div>
      
      <div class="form-row auth-options">
        <label class="checkbox-label">
          <input type="checkbox" name="remember" checked>
          <span>Remember for 30 days</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
        {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
      </div>
      
      <p class="auth-footer">验证后解锁密钥以持久 Cookie 保存 30 天 (同一浏览器免再次输入)</p>
    </form>
  </div>
</div>
{% endblock %}
