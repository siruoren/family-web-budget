{% extends "base.html" %}
{% block title %}管理员登录{% endblock %}

{% block content %}
<style>
  .auth-page .nav-bar, .auth-page .sidebar, .auth-page .footer {
    display: none !important;
  }
  .auth-page .layout {
    display: block;
  }
  .auth-page .main-content {
    padding: 0;
  }
</style>
<div class="auth-page">
  <div class="auth-wrap">
    <form class="auth-card" method="post" action="{{ url_for('auth.admin_login', next=next_url) }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <h2>Welcome back!</h2>
      <p class="auth-subtitle">Admin Access Required</p>
      
      <div class="form-row">
        <label>Admin Password</label>
        <input type="password" name="password" required autofocus autocomplete="current-password" placeholder="Enter admin password">
      </div>
      
      <div class="form-row auth-options">
        <label class="checkbox-label">
          <input type="checkbox" name="remember">
          <span>Remember session</span>
        </label>
      </div>
      
      <div class="form-actions">
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
        {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
      </div>
      
      <p class="auth-footer">管理员解锁为会话级, 关闭浏览器后需重新输入</p>
    </form>
  </div>
</div>
{% endblock %}
