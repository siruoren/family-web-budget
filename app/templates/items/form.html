{% extends "base.html" %}
{% block title %}{% if item %}编辑条目{% else %}新增条目{% endif %}{% endblock %}

{% block content %}
<h2 class="section-title">{% if item %}编辑条目{% else %}新增条目{% endif %}</h2>
<div class="card">
  <form method="post" action="{% if item %}{{ url_for('items.edit', item_id=item.id) }}{% else %}{{ url_for('items.new') }}{% endif %}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-row">
      <label>条目名称 *</label>
      <input type="text" name="name" required value="{{ item.name if item else '' }}" style="min-width:240px;">
    </div>
    <div class="form-row">
      <label>分类 *</label>
      <select name="category">
        {% for c in ['收入','支出','结余','其他'] %}
        <option value="{{ c }}" {% if item and item.category == c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label>归属</label>
      <select name="owner">
        {% for o in ['君','军','家庭','公共'] %}
        <option value="{{ o }}" {% if item and item.owner == o %}selected{% endif %}>{{ o }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label>子分类</label>
      <input type="text" name="sub_category" value="{{ item.sub_category if item else '' }}">
    </div>
    <div class="form-row">
      <label>默认值</label>
      <input type="number" step="0.01" name="default_value" value="{{ item.default_value if item else 0 }}">
      <input type="text" name="unit" value="{{ item.unit if item else '元' }}" style="width:60px;">
    </div>
    <div class="form-row">
      <label>排序</label>
      <input type="number" name="sort_order" value="{{ item.sort_order if item else 0 }}" style="width:100px;">
    </div>
    <div class="form-row">
      <label>启用</label>
      <input type="checkbox" name="is_active" {% if not item or item.is_active %}checked{% endif %}>
    </div>
    <div class="form-row">
      <label>备注</label>
      <input type="text" name="note" value="{{ item.note if item else '' }}" style="min-width:320px;">
    </div>
    <div class="form-row">
      <button type="submit" class="btn">保存</button>
      <a class="btn btn-secondary" href="{{ url_for('items.index') }}">取消</a>
    </div>
  </form>
</div>
{% endblock %}
