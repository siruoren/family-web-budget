{# 并发锁分片 - AJAX 替换整段 #}
<section id="locks" class="card" data-section="locks">
  <div class="card-hd">并发锁 <span class="muted">条目级编辑锁, 超时自动释放</span></div>
  <div class="card-body">
    <form method="post" action="{{ url_for('settings.update_lock_config') }}" class="inline-form" data-api="1">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="cb"><input type="checkbox" name="lock_enabled" {{ 'checked' if lock_config.enabled }}> 启用并发锁</label>
      <label>TTL(秒) <input type="number" name="lock_ttl" value="{{ lock_config.ttl }}" min="10" max="3600" style="width:5rem"></label>
      <label>心跳(秒) <input type="number" name="heartbeat_interval" value="{{ lock_config.heartbeat_interval }}" style="width:5rem"></label>
      <label>同步(秒) <input type="number" name="sync_interval" value="{{ lock_config.sync_interval }}" style="width:5rem"></label>
      <button class="btn btn-sm btn-primary">保存锁配置</button>
    </form>

    <h4>活跃锁 ({{ active_locks|length }})</h4>
    <table class="data-table">
      <thead><tr><th>ID</th><th>资源</th><th>周期</th><th>持有者</th><th>剩余</th><th>操作</th></tr></thead>
      <tbody>
      {% for lk in active_locks %}
      <tr>
        <td>{{ lk.id }}</td>
        <td>{{ lk.resource_type }}#{{ lk.resource_id }}</td>
        <td>{{ lk.period_key }}</td>
        <td>{{ lk.user_label }}</td>
        <td>{{ lk.remaining_seconds }}s</td>
        <td>
          <form method="post" action="{{ url_for('settings.force_release_lock', lock_id=lk.id) }}" data-api="1">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-sm">强制释放</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="6" class="empty-row">无活跃锁</td></tr>
      {% endfor %}
      </tbody>
    </table>
    <div class="actions-row">
      <form method="post" action="{{ url_for('settings.cleanup_expired_locks') }}" data-api="1">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="btn btn-sm">清理过期锁</button>
      </form>
      <form method="post" action="{{ url_for('settings.force_release_all_locks') }}"
            data-api="1" data-confirm="确认清空所有活跃锁?">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="text" name="confirm" placeholder="输入 确认清空" style="width:9rem">
        <button class="btn btn-sm btn-danger">一键清空</button>
      </form>
    </div>
  </div>
</section>
