services:
  web:
    build: .
    container_name: family-budget-prod
    ports:
      - "${SERVER_PORT:-5050}:5050"
    volumes:
      - db_data:/app/instance
      - upload_data:/app/uploads
      - export_data:/app/exports
    environment:
      - FLASK_CONFIG=prod
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=${DATABASE_URL:-}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=5050
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
  upload_data:
  export_data:
